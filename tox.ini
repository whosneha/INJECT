[tox]
envlist = py{39,310,311,312},lint,type

[testenv]
deps = pytest>=6.2.0
       pytest-cov>=2.12.0
commands = pytest {posargs:tests/}

[testenv:lint]
deps = flake8>=3.9.0
       black>=21.7b0
       isort>=5.9.0
commands = 
    black --check src/ tests/
    isort --check-only src/ tests/
    flake8 src/ tests/

[testenv:type]
deps = mypy>=0.910
commands = mypy src/ --ignore-missing-imports

[testenv:docs]
deps = mkdocs>=1.6.0
       mkdocs-material>=9.0.0
       mkdocstrings[python]>=0.20.0
commands = mkdocs build

[testenv:docs-serve]
deps = {[testenv:docs]deps}
commands = mkdocs serve

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,.tox,build,dist,*.egg-info
ignore = E203,W503,E501

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers -v

[coverage:run]
source = src
branch = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
