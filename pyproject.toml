[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-cluster-injection-pipeline"
version = "0.1.0"
description = "A comprehensive pipeline for injecting artificial star clusters into LSST Rubin Observatory images, with support for PSF convolution, detection testing, and completeness analysis."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Sneha Nair", email = "snehanair.astro@gmail.com"}
]
keywords = ["astronomy", "lsst", "rubin", "star-clusters", "injection", "simulations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "astropy>=4.3.0",
    "h5py>=3.0.0",
    "scikit-image>=0.18.0",
    "seaborn>=0.11.0",
    "pyyaml>=5.4.0",
    "requests>=2.26.0",
    "galsim>=2.3.0",
    "pyvo>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.7b0",
    "isort>=5.9.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "build>=1.2.1",
    "twine>=5.1.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings>=0.20.0",
    "mkdocstrings-python>=1.11.0",
]
rubin = [
    "lsst-distrib",
]
jupyter = [
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
    "ipython>=7.25.0",
]

[project.urls]
Homepage = "https://github.com/whosneha/INJECT"
Documentation = "https://star-cluster-injection-pipeline.readthedocs.io"
Repository = "https://github.com/whosneha/INJECT.git"
Issues = "https://github.com/whosneha/INJECT/issues"

[project.scripts]
injection-pipeline = "star_cluster_injection.cli:main"

[tool.setuptools]
include-package-data = true
packages = ["src", "star_cluster_injection"]

[tool.setuptools.package-dir]
src = "src"
star_cluster_injection = "src/star_cluster_injection"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "star_cluster_injection"]
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers -v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
