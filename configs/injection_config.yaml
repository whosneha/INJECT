run_name: rsp_i_band_example
band: i
n_clusters: 100
cutout_size: 1500
seed: 42
edge_buffer: 50
add_noise: true
use_actual_psf: true
psf_fwhm_fallback: 3.5
record_psf_mask_flags: true
skip_bad_psf_regions: false
output_dir: outputs/rsp_i_band_example

cluster_config:
  profile_type: plummer
  method: smooth
  mag_min: 20.0
  mag_max: 24.0
  r_half_min: 3.0
  r_half_max: 12.0
  concentration_min: 5.0
  concentration_max: 20.0
  age_min_gyr: 1.0
  age_max_gyr: 13.0

# Multiband example:
# bands: [g, r, i]
